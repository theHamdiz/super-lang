<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" aria-hidden="true">
  <!-- Girih-style 8-point star with radiating construction — stroke art for CSS mask -->
  <g stroke="#000" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="200" cy="200" r="28"/>
    <circle cx="200" cy="200" r="56"/>
    <circle cx="200" cy="200" r="92"/>
    <circle cx="200" cy="200" r="128"/>
    <circle cx="200" cy="200" r="164"/>
    <!-- orthogonal + diagonal rays -->
    <line x1="200" y1="18" x2="200" y2="382"/>
    <line x1="18" y1="200" x2="382" y2="200"/>
    <line x1="71.4" y1="71.4" x2="328.6" y2="328.6"/>
    <line x1="328.6" y1="71.4" x2="71.4" y2="328.6"/>
    <!-- squares -->
    <rect x="92" y="92" width="216" height="216"/>
    <rect x="92" y="92" width="216" height="216" transform="rotate(45 200 200)"/>
    <rect x="128" y="128" width="144" height="144"/>
    <rect x="128" y="128" width="144" height="144" transform="rotate(45 200 200)"/>
    <!-- 8-point star (two squares) -->
    <polygon points="200,48 248,152 352,200 248,248 200,352 152,248 48,200 152,152"/>
    <polygon points="200,72 232,168 328,200 232,232 200,328 168,232 72,200 168,168"/>
    <!-- petal arcs / interlacing hints -->
    <path d="M200 56 A144 144 0 0 1 344 200"/>
    <path d="M344 200 A144 144 0 0 1 200 344"/>
    <path d="M200 344 A144 144 0 0 1 56 200"/>
    <path d="M56 200 A144 144 0 0 1 200 56"/>
    <!-- small corner stars -->
    <polygon points="200,108 214,148 254,162 214,176 200,216 186,176 146,162 186,148"/>
  </g>
</svg>
