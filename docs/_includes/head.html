<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{{ '/site.css' | relative_url }}"/>
<script src="{{ '/super-highlight.js' | relative_url }}" defer></script>
<link rel="canonical" href="{{ page.url | absolute_url }}"/>
<link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}"/>
<link rel="icon" type="image/png" href="{{ '/assets/icons/super.png' | relative_url }}"/>
<link rel="apple-touch-icon" href="{{ '/assets/icons/super.png' | relative_url }}"/>
<meta name="theme-color" content="#ff7a1f"/>
<meta property="og:image" content="https://thehamdiz.github.io/super-lang/assets/og-image.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://thehamdiz.github.io/super-lang/assets/og-image.png"/>
{% seo %}
{% if page.extra_head %}{{ page.extra_head }}{% endif %}
