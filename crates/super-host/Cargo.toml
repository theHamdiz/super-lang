[package]
name = "super-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime host builtins (sys_*/crypto/IO kernels) that Super stdlib/*.sr calls via host — not the Super standard library"

[dependencies]
super-core.workspace = true
super-runtime.workspace = true
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"
blake2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
argon2 = "0.6"
bcrypt = "0.19"
getrandom = "0.3"
ml-kem = { version = "0.3", features = ["getrandom"] }
ml-dsa = { version = "0.1", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = "0.6"
itoa = "1"
ryu = "1"
libc = "0.2"
font8x8 = "0.3"

[lints]
workspace = true
