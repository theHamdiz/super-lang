# `super lint --config stdlib/lint.toml stdlib` — lint policy for the standard
# library, which is not a Pod. Every exception is listed with its reason.
# Rules: `super lint --rules`; documentation: docs/lint.md.

# S002 stutter: module-prefixed public names (`json_parse` in json.sr) are
# the established stdlib API and are also imported unqualified; renaming
# them is a breaking change deferred to a deliberate API pass.
