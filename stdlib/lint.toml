# S006 needless-mut: `@` kept on public handle APIs and a frozen kernel.
[[lint.exception]]
rule = "S006"
path = "ai/mcp_client.sr"
item = "list_tools.self"
reason = "client handle API: `@self` marks the session as the stateful side of the protocol; dropping it changes the public signature"

