name: Bug report
description: Report a compiler, runtime, or stdlib defect
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - compiler (frontend)
        - VM / JIT
        - C23 AOT
        - stdlib
        - CLI / installer
        - LSP
        - other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include `super run` / `super test` command
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: super --version
      placeholder: super 0.1.0
    validations:
      required: true